name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: Test
        run: python -m pytest tests -q --cov --cov-fail-under=80
      - name: Smoke
        run: python scripts/check_skeleton.py
      - name: Build
        run: python -m pip wheel . --no-deps -w dist